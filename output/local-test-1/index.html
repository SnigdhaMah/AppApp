<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Splitter</title>
    <link rel="stylesheet" href="./styles/main.css">
    <script src="./scripts/app.js" defer></script>
</head>
<body>
<!-- Branded navbar (injected into every app) -->
<nav class="navbar" aria-label="Main Navigation">
    <div class="navbar-inner">
        <span class="navbar-logo" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="28" height="28" rx="6" fill="var(--accent)"/>
                <path d="M8 14h4v6H8v-6zm8-6h-4v12h4V8zm-8 2h4v4H8v-4z" fill="white" opacity="0.95"/>
            </svg>
        </span>
        <span class="navbar-brand">Build Apps</span>
    </div>
</nav>
<div class="container">
    <header>
        <h1>Check Splitter</h1>
    </header>
    <main>
        <section id="bill-entry" class="card">
            <label for="bill-amount">Total Bill Amount</label>
            <input type="number" id="bill-amount" aria-label="Total Bill" placeholder="Enter total bill" min="0">
        </section>
        <section id="participant-management" class="card">
            <form id="participant-form">
                <label for="participant-name">Name</label>
                <input type="text" id="participant-name" aria-label="Participant Name" placeholder="Name" required>
                <label for="participant-email">Email (optional)</label>
                <input type="email" id="participant-email" aria-label="Participant Email" placeholder="Email (optional)">
                <button type="submit">Add Participant</button>
            </form>
            <ul id="participant-list"></ul>
        </section>
        <section id="split-options" class="card">
            <button id="even-split" class="primary">Even Split</button>
            <button class="secondary" id="custom-split">Custom Split</button>
            <button class="ghost" id="itemized-split">Itemized Split</button>
        </section>
        <section id="adjustments" class="card">
            <label for="tax-percentage">Tax Percentage</label>
            <input type="number" id="tax-percentage" aria-label="Tax Percentage" placeholder="Tax %" min="0" step="0.01">
            <label for="tip-percentage">Tip Percentage</label>
            <input type="number" id="tip-percentage" aria-label="Tip Percentage" placeholder="Tip %" min="0" step="0.01">
        </section>
        <section id="summary" class="card">
            <div id="summary-view" role="alert"></div>
        </section>
        <footer>
            <button id="finalize" class="primary">Finalize</button>
            <button class="secondary" id="reset">Reset</button>
        </footer>
    </main>
</div>
</body>
</html>
